# ================================================================
# LaptopWorld frontend — Nginx config cho SPA + reverse proxy
# - SPA fallback: moi route khong match file → tra ve index.html
#   (de React Router v6 client-side routing hoat dong)
# - /api → proxy sang backend:8080
# - /uploads → proxy sang backend:8080 (anh SP, banner)
# ================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bao mat: an nginx version
    server_tokens off;

    # ----- Reverse proxy API + uploads -----
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeout dai hon cho AI chat + upload
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }

    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        # Cache anh SP 7 ngay
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ----- Static assets caching -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # ----- SPA fallback (React Router) -----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- Gzip compression -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_comp_level 6;

    # ----- Error pages -----
    error_page 404 /index.html;
}
