# ==============================================================
# LaptopWorld — TEST profile
# ==============================================================
# Chi dung cho unit test + integration test.
# Khong ket noi Postgres/Gemini/SMTP that.
# ==============================================================

# ----- JWT (test secret — fake) -----
app.jwt.secret=test_only_fake_secret_key_for_hs256_algorithm_min_64_bytes_long_ok_ok_ok
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-days=7
app.jwt.issuer=laptopworld-test

# ----- CORS -----
app.cors.allowed-origins=http://localhost:5173

# ----- Frontend URL -----
app.frontend.url=http://localhost:5173

# ----- Token TTL -----
app.verification.token-ttl-hours=24
app.password-reset.token-ttl-minutes=30

# ----- VNPay (test fake credentials) -----
app.payment.vnpay.tmn-code=TESTMERCHANT
app.payment.vnpay.hash-secret=SANDBOXHASHSECRETFORHMACSHA512TESTONLY
app.payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
app.payment.vnpay.return-url=http://localhost:5173/thanh-toan/vnpay/ket-qua
app.payment.vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
app.payment.vnpay.version=2.1.0
app.payment.vnpay.command=pay
app.payment.vnpay.curr-code=VND
app.payment.vnpay.locale=vn
app.payment.vnpay.order-type=250000

# ----- Gemini (khong goi that trong test) -----
app.ai.gemini.api-key=test-fake-key
app.ai.gemini.base-url=http://localhost:0
app.ai.gemini.model=gemini-3.5-flash
app.ai.gemini.embedding-model=gemini-embedding-001
app.ai.gemini.embedding-dim=768
app.ai.gemini.timeout-seconds=5
app.ai.chat.max-messages-per-hour=30
app.ai.chat.max-messages-burst=5
app.ai.embedding.batch-size=20
app.ai.embedding.batch-delay-ms=100

# ----- SMTP (fake — MailService da mock, khong goi that) -----
spring.mail.host=localhost
spring.mail.port=25
spring.mail.default-encoding=UTF-8
spring.mail.username=test@test.local
spring.mail.password=test

# ----- Thymeleaf -----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----- Actuator -----
management.endpoint.health.show-details=always

# ----- Devtools -----
spring.devtools.restart.enabled=false

# ----- Logging -----
logging.level.root=WARN
logging.level.com.example.LaptopWorld_project=INFO
