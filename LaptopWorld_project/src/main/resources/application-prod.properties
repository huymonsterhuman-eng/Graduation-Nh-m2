# ==============================================================
# LaptopWorld — PROD profile (Docker Compose)
# ==============================================================
# Toan bo bien nhay cam load qua ENV tu docker-compose.yml.
# Chay: SPRING_PROFILES_ACTIVE=prod
# ==============================================================

# ----- PostgreSQL -----
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:laptopworld}
spring.datasource.username=${DB_USER:laptopworld_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ----- JPA (prod) -----
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ----- Flyway (prod — cam clean, cho phep out-of-order de V14_5 chay sau V20 tren dev DB) -----
spring.flyway.clean-disabled=true
spring.flyway.clean-on-validation-error=false
spring.flyway.out-of-order=true

# ----- JWT (secret bat buoc tu ENV) -----
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-days=7
app.jwt.issuer=laptopworld

# ----- CORS (prod — chi allow frontend URL cu the) -----
app.cors.allowed-origins=${APP_FRONTEND_URL:http://localhost}

# ----- Frontend URL (dung xay link email) -----
app.frontend.url=${APP_FRONTEND_URL:http://localhost}

# ----- Verification token TTL -----
app.verification.token-ttl-hours=24
app.password-reset.token-ttl-minutes=30

# ----- SMTP (load tu ENV) -----
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.default-encoding=UTF-8

# ----- Thymeleaf (prod — bat cache) -----
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----- Gemini AI -----
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.ai.gemini.model=gemini-3.5-flash
app.ai.gemini.embedding-model=gemini-embedding-001
app.ai.gemini.embedding-dim=768
app.ai.gemini.timeout-seconds=30
app.ai.chat.max-messages-per-hour=180
app.ai.chat.max-messages-burst=20
app.ai.embedding.batch-size=20
app.ai.embedding.batch-delay-ms=500

# ----- VNPay -----
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
app.payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost/thanh-toan/vnpay/ket-qua}
app.payment.vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
app.payment.vnpay.version=2.1.0
app.payment.vnpay.command=pay
app.payment.vnpay.curr-code=VND
app.payment.vnpay.locale=vn
app.payment.vnpay.order-type=250000

# ----- Actuator (prod — an chi tiet) -----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ----- Devtools tat -----
spring.devtools.restart.enabled=false

# ----- Logging (prod — INFO, khong DEBUG) -----
logging.level.root=INFO
logging.level.com.example.LaptopWorld_project=INFO
logging.level.org.hibernate.SQL=WARN
