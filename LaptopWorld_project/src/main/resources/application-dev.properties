# ==============================================================
# LaptopWorld — DEV profile
# ==============================================================
# LƯU Ý: File này commit lên git. Password/secret nhạy cảm
# hãy đặt trong `application-local.properties` (đã gitignore)
# hoặc biến môi trường. Ví dụ set biến trên Windows PowerShell:
#   $env:DB_PASSWORD = "yourpassword"
# ==============================================================

# ----- PostgreSQL -----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:laptopworld_dev}
spring.datasource.username=${DB_USER:laptopworld_app}
spring.datasource.password=${DB_PASSWORD:laptopworld_dev_pw}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ----- JPA (dev) -----
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ----- Flyway (dev) -----
# clean-on-validation-error=false: an toan. Neu muon reset DB, chay flyway:clean thu cong.
spring.flyway.clean-on-validation-error=false
spring.flyway.clean-disabled=false
# Cho phep out-of-order de V14_5 chay tren dev DB (da co V20)
spring.flyway.out-of-order=true

# ----- JWT (dev secret — DO NOT USE IN PROD) -----
# Sinh secret: openssl rand -base64 64  hoac https://generate-secret.vercel.app/64
app.jwt.secret=${JWT_SECRET:dev_only_change_me_this_is_a_very_long_placeholder_secret_key_for_hs256_algorithm_min_64_bytes_long_ok}
app.jwt.access-token-ttl-minutes=15
app.jwt.refresh-token-ttl-days=7
app.jwt.issuer=laptopworld

# ----- CORS (Frontend Vite dev) -----
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ----- Frontend URL (dung xay link email) -----
app.frontend.url=http://localhost:5173

# ----- Verification token TTL -----
app.verification.token-ttl-hours=24
app.password-reset.token-ttl-minutes=30

# ----- SMTP Gmail -----
# Username + password nam trong application-local.properties (gitignored)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.default-encoding=UTF-8

# ----- Thymeleaf (dung render email HTML) -----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----- Gemini AI -----
# Lay API key mien phi tai https://aistudio.google.com/apikey — dat trong application-local.properties
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.ai.gemini.model=gemini-3.5-flash
app.ai.gemini.embedding-model=gemini-embedding-001
app.ai.gemini.embedding-dim=768
app.ai.gemini.timeout-seconds=30
app.ai.chat.max-messages-per-hour=180
app.ai.chat.max-messages-burst=20
app.ai.embedding.batch-size=20
app.ai.embedding.batch-delay-ms=500

# ----- Actuator (dev show all details) -----
management.endpoint.health.show-details=always

# ----- Devtools: tắt auto-restart vì bug NoClassDefFoundError với Java 25 -----
# App sẽ chỉ start 1 lần, mọi thay đổi code cần user restart thủ công.
spring.devtools.restart.enabled=false

# ----- VNPay (Phase 10) -----
# Dang ky sandbox mien phi tai https://sandbox.vnpayment.vn/devreg
# tmnCode + hashSecret dat trong application-local.properties (gitignored).
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
app.payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/thanh-toan/vnpay/ket-qua}
app.payment.vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
app.payment.vnpay.version=2.1.0
app.payment.vnpay.command=pay
app.payment.vnpay.curr-code=VND
app.payment.vnpay.locale=vn
app.payment.vnpay.order-type=250000
