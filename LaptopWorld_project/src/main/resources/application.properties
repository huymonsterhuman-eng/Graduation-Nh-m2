# ==============================================================
# LaptopWorld — Application config (common)
# ==============================================================
# Profile riêng (dev/prod) sẽ override các thuộc tính bên dưới.
# Đặt profile khi chạy: --spring.profiles.active=dev
# ==============================================================

spring.application.name=LaptopWorld
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ----- Server -----
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# ----- Jackson -----
# Spring Boot 4.1 dung Jackson 3 (package tools.jackson.*). Jackson 3 mac dinh
# da serialize date/time theo ISO-8601 chuan, khong can WRITE_DATES_AS_TIMESTAMPS.
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ----- JPA (chung) -----
# ddl-auto=validate: KHÔNG cho phép Hibernate tự tạo/sửa schema.
# Toàn bộ schema quản lý qua Flyway migration ở Phase 1.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.format_sql=true

# ----- Flyway -----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ----- Actuator (health check) -----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ----- File upload -----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# ----- OpenAPI / Swagger -----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# ----- Logging -----
logging.level.root=INFO
logging.level.com.example.LaptopWorld_project=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
