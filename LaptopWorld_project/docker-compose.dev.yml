# Docker Compose cho DEV — chỉ PostgreSQL + pgvector.
# Ứng dụng Spring Boot chạy trực tiếp bằng ./mvnw spring-boot:run.
#
# Chạy:   docker compose -f docker-compose.dev.yml up -d
# Dừng:   docker compose -f docker-compose.dev.yml down
# Xóa hẳn (mất data):  docker compose -f docker-compose.dev.yml down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: laptopworld_postgres_dev
    restart: unless-stopped
    ports:
      - "5433:5432"          # Host 5433 → tránh đụng PostgreSQL native (nếu đang chạy) ở 5432
    environment:
      POSTGRES_DB: laptopworld_dev
      POSTGRES_USER: laptopworld_app
      POSTGRES_PASSWORD: laptopworld_dev_pw
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - laptopworld_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laptopworld_app -d laptopworld_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  laptopworld_pgdata:
